<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 專業管理後台 (測試環境)</title>
    <!-- 引入強大的 SheetJS 套件 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --warning: #f4b400; --danger: #d93025; --text-main: #3c4043; --text-sub: #70757a; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f3f4; color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1350px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); margin-bottom: 25px; border: 2px dashed #f4b400; }
        h1 { color: var(--text-main); font-size: 20px; font-weight: 500; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .top-nav { background: #202124; color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; gap: 15px; border: none; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap;}
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #e8f0fe; color: var(--primary); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; } 
        th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #eee; color: var(--text-sub); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; } 
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; color: white !important; }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-primary { background: #1a73e8; }
        .btn-danger { background: #d93025; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #f4b400; }
        .btn-edit { background: white; border: 1px solid #dadce0; color: var(--text-main) !important; }

        .hr-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; }
        .form-group input:disabled { background-color: #e9ecef; cursor: not-allowed; }

        .sched-table th, .sched-table td { padding: 4px; text-align: center; min-width: 32px; border: 1px solid #eee; }
        .shift-sel { padding: 2px; width: 100%; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; cursor:pointer; font-weight: bold;}
        .punch-panel { background: #e8f0fe; padding: 15px; border-radius: 8px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; border: 1px solid #cce0ff; margin-bottom: 15px; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:#1a73e8;">處理中，請稍候...</div></div>

<div class="container top-nav">
    <div style="font-size:18px; font-weight:bold;">禾禾園 · 專業後台系統 <span style="color:#f4b400;">(測試環境)</span></div>
    <div class="nav-actions" style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <select id="adminRole" onchange="authRole()" style="background:#3c4043; color:white; border:none; padding:10px; border-radius:6px; outline:none; font-size:14px; cursor:pointer;">
            <option value="人事部">資料載入中...</option>
        </select>
        <button id="btnChangePwd" class="btn btn-edit" style="display:none; color:var(--danger) !important; font-weight:bold; border: 1px solid var(--danger);" onclick="changeAdminPassword()">🔑 更換專屬密碼</button>
        <button class="btn btn-primary" onclick="fetchData()">🔄 同步雲端資料</button>
    </div>
</div>

<div class="container" style="border: none; padding: 0; box-shadow: none; margin-bottom: 15px;">
    <div class="tab-container" style="border-bottom:none; margin-bottom:0;">
        <button id="tab-leave" class="tab-btn active" onclick="switchNavTab('leaveBox')">📝 假單審核中心</button>
        <button id="tab-schedule" class="tab-btn" onclick="switchNavTab('scheduleBox')">📅 部門排班表</button>
        <button id="tab-attendance" class="tab-btn" onclick="switchNavTab('attendanceBox')">🕒 出勤紀錄與補登</button>
        <button id="tab-hr" class="tab-btn" onclick="switchNavTab('hrBox')" style="display:none;">👥 人事維護</button>
        <button id="tab-dept" class="tab-btn" onclick="switchNavTab('deptBox')" style="display:none;">🏢 部門編制管理</button>
        <button id="tab-salary" class="tab-btn" onclick="switchNavTab('salaryBox')" style="display:none;">💰 薪資結算</button>
    </div>
</div>

<!-- 此處為假單、排班等其他分頁 HTML 結構 (省略未更動的標籤以節省版面，請直接保留您原本檔案中的這部分) -->
<!-- ... (保留原有 HTML) ... -->

<div id="salaryBox" class="container" style="display:none; background-color: #fffaf0; border: 2px solid #ffc107;">
    <h1>💰 月底薪資結算與報表匯出</h1>
    <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background:#fef5e7; padding:10px 15px; border-radius:8px; border:1px solid #f9e79f;">
                <label style="font-weight:bold; color:#d35400; font-size: 16px; margin-right:10px;">📅 選擇結算月份</label>
                <input type="month" id="salaryMonth" onchange="renderSalary()" style="padding:8px; border-radius:6px; border:1px solid #ccc; font-weight:bold; font-size: 15px; outline:none; cursor:pointer;">
            </div>
        </div>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <input type="file" id="perfExcelUpload" accept=".xlsx, .xls" style="display: none;" onchange="handleExcelUpload(event)">
            <button class="btn btn-warning" style="height: 45px; padding: 0 25px; color:#333 !important;" onclick="triggerExcelUpload()">📤 匯入司機業績表</button>
            <button class="btn btn-primary" style="height: 45px; padding: 0 25px;" onclick="calculateSalary()">⚙️ 1. 執行薪資結算</button>
            <button class="btn btn-danger" style="height: 45px; padding: 0 25px;" onclick="generatePDF()">📄 2. 產出 PDF 薪資單</button>
            <button class="btn btn-success" style="height: 45px; padding: 0 25px;" onclick="exportExcel()">📊 3. 下載 Excel 報表</button>
        </div>
    </div>
    <div class="table-responsive"><table><thead><tr style="background:#f8f9fa;"><th>結算月份</th><th>姓名</th><th>部門</th><th>總工時</th><th>基本薪資</th><th>遲到/請假扣款</th><th>實發總計</th></tr></thead><tbody id="salaryBody"></tbody></table></div>
</div>

<script>
    // 💡 請確保此 URL 是您測試區專屬的 API 網址！
    const CONFIG_URL = "https://script.google.com/macros/s/AKfycbzaPP6NMHAGtKKTiIUYysctkvoLIxK7gcbv6mOzui70PzSmEShACRhfebjg-NLmC34O/exec";
    
    // ... [保留原本所有的 JavaScript 函式 (switchNavTab, fetchData等)] ...

    // 🚀 【全新升級】：前端一鍵匯入司機業績，獨立抽離代送費！
    function triggerExcelUpload() {
        document.getElementById('perfExcelUpload').click();
    }

    function handleExcelUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const month = document.getElementById('salaryMonth').value;
        if (!month) {
            alert("請先選擇要匯入的結算月份！");
            event.target.value = "";
            return;
        }

        showLoading("解析業績表中...");
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                let perfData = [];
                for (let i = 1; i < jsonData.length; i++) {
                    const row = jsonData[i];
                    if (!row || row.length < 2) continue;
                    
                    let rawName = String(row[1] || "").trim();
                    if (!rawName || rawName === "NaN" || rawName.includes("總計") || rawName === "司機送貨/調貨總表") continue;
                    let cleanName = rawName.replace(/^[0-9]+\./, '').trim();
                    
                    let deliveryAmt = Number(row[2]) || 0; 
                    let transferAmt = Number(row[3]) || 0; 
                    let totalAmt = Number(row[4]) || 0;    
                    
                    // 1. 計算純「送貨」達標獎金
                    let deliveryBonus = 0;
                    if (totalAmt > 2500000) {
                        deliveryBonus = Math.floor((totalAmt - 2500000) * 0.01);
                    }
                    
                    // 2. 獨立抽離「代送費」加總
                    let yiBaoKang = Number(row[9]) || 0; 
                    let zhuJian = Number(row[10]) || 0;  
                    let agentBonus = yiBaoKang + zhuJian;
                    
                    // 將兩筆資料獨立送到後端
                    if (totalAmt > 0 || deliveryBonus > 0 || agentBonus > 0) {
                        perfData.push({ 
                            name: cleanName, 
                            delivery: deliveryAmt, 
                            transfer: transferAmt, 
                            deliveryBonus: deliveryBonus, 
                            agentBonus: agentBonus 
                        });
                    }
                }

                if (perfData.length === 0) {
                    alert("解析不到任何有效的司機業績資料，請確認檔案格式！");
                    hideLoading();
                    return;
                }

                uploadPerfToBackend(month, perfData);
                
            } catch (err) {
                console.error(err);
                alert("解析失敗，請確認檔案格式是否正確！");
                hideLoading();
            } finally {
                event.target.value = ""; 
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function uploadPerfToBackend(month, perfData) {
        try {
            const res = await fetch(CONFIG_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "uploadDriverPerf",
                    key: getCurrentKey(),
                    month: month,
                    perfData: perfData
                })
            });
            const result = await res.text();
            if (result === "Success") {
                alert(`✅ ${month} 月司機業績已成功匯入！\n\n(「送貨達標」與「代送費」已獨立結算，將於您按下「執行薪資結算」時同步併入薪資單)`);
            } else {
                alert("匯入失敗：" + result);
            }
        } catch (e) {
            alert("網路連線異常，匯入失敗");
        } finally {
            hideLoading();
        }
    }

    // 🚀 動態渲染薪資畫面 (適應新版增加的欄位索引)
    function renderSalary() { 
        const month = document.getElementById('salaryMonth').value; 
        const tbody = document.getElementById('salaryBody'); 
        if (!month || !db.Salary_Summary) { 
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#aaa;">請先選擇結算月份</td></tr>'; 
            return; 
        } 
        const rows = db.Salary_Summary.filter(r => r[0] && String(r[0]).includes(month)); 
        if (rows.length === 0) { 
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#d93025;">此月份尚未結算</td></tr>'; 
            return; 
        } 
        tbody.innerHTML = rows.map(r => { 
            const isNewFormat = r.length >= 25; // 判斷是否為有代送獎金的新版報表
            const idxLate = isNewFormat ? 15 : 14;
            const idxPLeave = isNewFormat ? 18 : 17;
            const idxSLeave = isNewFormat ? 21 : 20;
            const idxTotal = isNewFormat ? 24 : 23;
            
            const totalDeduct = Number(r[idxLate] || 0) + Number(r[idxPLeave] || 0) + Number(r[idxSLeave] || 0); 
            return `<tr><td>${String(r[0] || "").replace(/'/g, "")}</td><td><b>${r[1] || ""}</b></td><td>${r[2] || ""}</td><td>${r[4] || 0} 工時</td><td>$${r[5] || 0}</td><td style="color:#d93025;">-$${totalDeduct}</td><td><h4 style="margin:0; color:#1a73e8;">$${r[idxTotal] || 0}</h4></td></tr>`; 
        }).join(''); 
    }

    // ... [保留原本其他的按鈕執行函式 (calculateSalary, generatePDF 等)] ...
    // fetchData() 將會由 HTML 載入時觸發
</script>
</body>
</html>
