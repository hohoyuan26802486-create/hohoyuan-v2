<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 智能考勤系統 V37.20 (支援特准放行)</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #1a73e8; --danger: #d93025; --success: #28a745; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #eef2f7; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; position: relative;}
        
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 18px 10px; color: #5f6368; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 16px;}
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #f8faff; }
        
        .form-content { padding: 25px; display: none; }
        .form-content.active { display: block; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #3c4043; margin-bottom: 8px; }
        .input-group select, .input-group input[type="text"], .input-group input[type="datetime-local"], .input-group input[type="file"] { 
            width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; font-size: 16px; 
            background-color: white; box-sizing: border-box; outline: none; -webkit-appearance: none; appearance: none;
        }
        select:disabled { background-color: #e9ecef; color: #6c757d; font-weight: bold; cursor: not-allowed; opacity: 1; border-color: #ced4da; }
        
        .type-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-toggle label { flex: 1; text-align: center; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; background: #f8f9fa; }
        .type-toggle input { display: none; }
        .type-toggle input:checked + label { background: var(--primary); color: white; border-color: var(--primary); }

        .status-options { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .status-btn { flex: 1; min-width: 130px; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; text-align: center; font-size: 14px; cursor: pointer; background: #f8f9fa; font-weight: 600; }
        .status-btn.selected { background: #e8f0fe; border-color: var(--primary); color: var(--primary); }

        .gps-box { padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 600; margin-bottom: 20px; display: none; }
        .gps-ok { background: #e6fffa; color: #234e52; border: 1px solid #38b2ac; display: block; }
        .gps-fail { background: #fff5f5; color: #742a2a; border: 1px solid #feb2b2; display: block; }

        .btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.3); transition: 0.2s;}
        .btn-submit:disabled { background: #e0e0e0; color: #9e9e9e; cursor: not-allowed; box-shadow: none; }
        
        #unlockLink { text-align: right; margin-bottom: 10px; }
        #unlockLink a { font-size: 12px; color: var(--danger); text-decoration: none; font-weight: bold; }
        
        .holiday-box { display: none; background: #e8f0fe; border: 1px solid #aecbfa; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .holiday-box label { color: #1a73e8; font-weight: bold; margin-bottom: 8px; display: block; }

        #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; border-radius: 20px;}
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:var(--primary);">資料處理中...</div></div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('clockIn')">📍 打卡</div>
        <div class="tab" onclick="switchTab('leave')">📝 請假</div>
        <div class="tab" onclick="switchTab('proofTab')">📎 補件</div>
    </div>

    <div id="clockIn" class="form-content active">
        <div class="input-group"><label>👤 員工姓名</label><select id="attName" onchange="syncName(this.value)"></select></div>
        <div id="unlockLink"><a href="#" onclick="unlockDevice()">🔑 解除手機鎖定 (HR 專用)</a></div>
        
        <div id="holidayTypeBox" class="holiday-box">
            <label id="holidayLabel">🚨 本日為假日/週末，請選擇出勤屬性</label>
            <select id="holidayType" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #1a73e8;">
                <option value="假日值班 (算加班費)">假日值班 (算加班費)</option>
                <option value="假日值班 (擇日補休)">假日值班 (擇日補休)</option>
            </select>
        </div>

        <div class="type-toggle">
            <input type="radio" name="attType" id="typeIn" value="上班" checked onchange="handleTypeChange()">
            <label for="typeIn">上班打卡</label>
            <input type="radio" name="attType" id="typeOut" value="下班" onchange="handleTypeChange()">
            <label for="typeOut">下班打卡</label>
        </div>

        <div id="statusArea">
            <label style="font-size: 14px; font-weight: 600; color: #3c4043;">⏱️ 自動狀態判定</label>
            <div id="statusList" class="status-options" style="margin-top:8px;"></div>
        </div>

        <div class="input-group" id="overtimeBox" style="display: none; background: #fff3cd; padding: 15px; border-radius: 10px; border: 1px solid #ffe69c;">
            <label style="color: #856404;">📝 請填寫事由 (加班/值班必填)</label>
            <input type="text" id="overtimeReason" placeholder="例如：處理急件、庫存盤點..." style="border-color: #ffe69c;">
        </div>

        <div id="gpsStatusBox" class="gps-box gps-fail">📍 正在獲取手機定位... (請允許權限)</div>
        <button id="btnAtt" class="btn-submit" onclick="submitAttendance()" disabled>等待定位中...</button>
    </div>

    <div id="leave" class="form-content">
        <div class="input-group"><label>👤 員工姓名</label><select id="lvName" onchange="syncName(this.value)"></select></div>
        <div class="input-group">
            <label>📌 假別選擇</label>
            <select id="lvType" onchange="handleLeaveTypeChange()">
                <option value="事假">事假</option>
                <option value="病假">病假</option>
                <option value="生理假">生理假</option>
                <option value="特休">特休</option>
                <option value="補休">補休</option> 
                <option value="公假">公假</option>
                <option value="婚假">婚假</option>
                <option value="喪假">喪假</option>
                <option value="產假">產假</option>
                <option value="其他">其他</option>
            </select>
            <div id="annualLeaveBox" style="display: none; margin-top: 10px; padding: 12px; background: #e8f0fe; border-radius: 8px; border: 1px solid #aecbfa; color: #1a73e8; font-size: 14px; font-weight: bold;">
                🏖️ 目前特休餘額：<span id="annualLeaveCount" style="color: #d93025; font-size: 18px;">-</span> 天
            </div>
        </div>
        <div class="input-group"><label>🤝 職位代理人</label><select id="lvAgent"><option value="無">無</option></select></div>
        <div class="input-group"><label>📅 開始時間</label><input type="datetime-local" id="lvStart"></div>
        <div class="input-group"><label>📅 結束時間</label><input type="datetime-local" id="lvEnd"></div>
        <div class="input-group"><label>📝 請假事由</label><input type="text" id="lvReason" placeholder="原因"></div>
        <div class="input-group"><label>📸 證明照片 (後補件可免附)</label><input type="file" id="lvFile" accept="image/*"></div>
        
        <div class="input-group" style="background: #fff3cd; padding: 15px; border-radius: 10px; border: 1px solid #ffe69c;">
            <label for="managerOverride" style="color: #856404; display: flex; align-items: center; gap: 10px; margin: 0; cursor: pointer; font-size: 14px;">
                <input type="checkbox" id="managerOverride" style="width: 24px; height: 24px; margin: 0; cursor: pointer; background: white;">
                ⚠️ 若遭系統阻擋，請於主管協調同意後勾選此處，方可送出假單
            </label>
        </div>

        <button id="btnLv" class="btn-submit" onclick="submitLeave()">送出假單</button>
    </div>

    <div id="proofTab" class="form-content">
        <div class="input-group"><label>👤 員工姓名</label><select id="prfName" onchange="syncName(this.value); loadPendingProofs();"></select></div>
        <div class="input-group"><label>📝 選擇缺件假單</label><select id="prfSelect"></select></div>
        <div class="input-group"><label>📸 照片</label><input type="file" id="prfFile" accept="image/*"></div>
        <button id="btnPrf" class="btn-submit" onclick="submitProof()">送出補件</button>
    </div>
</div>

<script>
    // ⚠️ 確認這裡是您的最新 API 網址！
    const API_URL = "https://script.google.com/macros/s/AKfycbw33nAqelLWJFWD4Sv1mfNLhBfLYPoC9fwYl80WUcJMuum-59xB8gJR_94IS11a-0wkOA/exec";
    
    const FLEX_WORKERS = ["陳美玲", "簡金嬌"]; 
    const NO_GPS_WORKERS = ["蔡政達"];
    const HOLIDAYS_2026 = ["2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-02-19", "2026-02-20", "2026-02-21", "2026-02-22", "2026-02-27", "2026-02-28", "2026-04-03", "2026-04-04", "2026-05-01", "2026-06-19", "2026-09-25", "2026-10-09", "2026-10-10"];
    const TARGET_LAT = 24.956646; const TARGET_LON = 121.393925; 
    let ALLOWED_DIST = 1.0; 
    let userLat = null, userLon = null, isWithinRange = false, globalDB = null, selectedStatus = "";

    const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    function showLoading(text) { document.getElementById('loadingText').innerText = text; document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

    function isHolidayToday() {
        const now = new Date(); const day = now.getDay(); const dateStr = now.toLocaleDateString('sv-SE');
        return (day === 0 || day === 6 || HOLIDAYS_2026.includes(dateStr));
    }

    function syncName(name) {
        if(!name) return;
        document.getElementById('attName').value = name;
        document.getElementById('lvName').value = name;
        document.getElementById('prfName').value = name;
        handleLeaveTypeChange(); handleTypeChange(); 
    }

    function handleLeaveTypeChange() {
        const type = document.getElementById('lvType').value;
        const box = document.getElementById('annualLeaveBox');
        if(!box) return;
        if (type === '特休') {
            box.style.display = 'block'; updateAnnualLeave(document.getElementById('lvName').value);
        } else { box.style.display = 'none'; }
    }

    function updateAnnualLeave(name) {
        if (!globalDB || !globalDB.employees || !globalDB.leave) return;
        const emp = globalDB.employees.find(r => r[0] === name);
        if (!emp) return;
        const totalLeave = Number(emp[5]) || 0; 
        const usedLeave = globalDB.leave.filter(r => r[2] === name && r[4] === "特休" && r[8] === "已生效").length;
        const remain = totalLeave - usedLeave;
        const countSpan = document.getElementById('annualLeaveCount');
        if(countSpan) countSpan.innerText = remain;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function handleTypeChange() {
        try {
            const currentName = document.getElementById('attName').value;
            const isFlexWorker = FLEX_WORKERS.includes(currentName);
            const holidayBox = document.getElementById('holidayTypeBox');
            holidayBox.style.display = isHolidayToday() ? "block" : "none";

            const typeInput = document.querySelector('input[name="attType"]:checked');
            if(!typeInput) return;
            const type = typeInput.value;
            const list = document.getElementById('statusList');
            const overtimeBox = document.getElementById('overtimeBox');
            if(overtimeBox) overtimeBox.style.display = "none";

            const now = new Date(); const time = now.getHours() * 60 + now.getMinutes();
            if(list) list.innerHTML = "";

            if (type === "上班") {
                if (isFlexWorker) { 
                    addStatusBtn("打卡紀錄 (彈性上班)", true); 
                } else {
                    if (time < 440) addStatusBtn("個人因素提早上班", true);
                    else if (time >= 440 && time <= 450) addStatusBtn("正常上班", true);
                    else addStatusBtn("遲到", true);
                    
                    addStatusBtn("請假後上班", false); 
                    addStatusBtn("外出回廠上班", false);
                }
            } else {
                if (isFlexWorker) { 
                    addStatusBtn("打卡紀錄 (彈性下班)", true); 
                } else {
                    if (time >= 1010) { 
                        addStatusBtn("因個人因素延後下班", true); 
                        addStatusBtn("經主管核准加班", false);
                    } else { addStatusBtn("正常下班", true); }
                    
                    addStatusBtn("值班(換補休)", false); 
                    addStatusBtn("外出暫時下班", false);
                }
            }
            updateGPSUI();
        } catch(e) { console.error(e); }
    }

    function addStatusBtn(txt, isSelected) {
        const div = document.createElement('div');
        div.className = isSelected ? "status-btn selected" : "status-btn"; div.innerText = txt;
        if(isSelected) {
            selectedStatus = txt;
            const ob = document.getElementById('overtimeBox');
            if(ob) ob.style.display = (txt.includes("加班") || txt.includes("值班")) ? "block" : "none";
        }
        div.onclick = function() {
            document.querySelectorAll('#statusList .status-btn').forEach(b => b.classList.remove('selected'));
            div.classList.add('selected'); selectedStatus = txt;
            const ob = document.getElementById('overtimeBox');
            if(ob) ob.style.display = (txt.includes("加班") || txt.includes("值班")) ? "block" : "none";
        };
        const statusList = document.getElementById('statusList');
        if(statusList) statusList.appendChild(div);
    }

    function updateGPSUI() {
        const box = document.getElementById('gpsStatusBox'); 
        const btn = document.getElementById('btnAtt');
        if(!box || !btn) return;
        const currentName = document.getElementById('attName').value;
        const typeInput = document.querySelector('input[name="attType"]:checked');
        const isTypeOut = typeInput && typeInput.value === "下班";

        if (!isMobileDevice) {
            box.innerHTML = "🖥️ 禁止使用電腦打卡<br>請拿起您的手機進行操作。";
            box.className = "gps-box gps-fail"; btn.disabled = true; btn.innerText = "請使用手機打卡"; return; 
        }
        const isFlexWorker = FLEX_WORKERS.includes(currentName);
        const isNoGpsWorker = NO_GPS_WORKERS.includes(currentName); 
        if (isFlexWorker || isNoGpsWorker) { box.innerText = "🏃 免定位模式已啟動"; box.className = "gps-box gps-ok"; btn.disabled = false; btn.innerText = "送出打卡"; return; }
        if (userLat === null || userLon === null) { 
            box.innerHTML = "❌ 偵測不到手機定位<br>請允許瀏覽器定位權限！"; box.className = "gps-box gps-fail"; btn.disabled = true; btn.innerText = "請先允許定位"; return;
        } 
        if (isTypeOut || isWithinRange) { box.innerText = "✅ 定位成功"; box.className = "gps-box gps-ok"; btn.disabled = false; btn.innerText = "送出打卡"; } 
        else { box.innerText = "❌ 距離太遠，請回公司再打卡"; box.className = "gps-box gps-fail"; btn.disabled = true; btn.innerText = "不在打卡範圍內"; }
    }

    async function fetchEmployees() {
        showLoading("載入資料中...");
        try {
            const res = await fetch(API_URL); globalDB = await res.json();
            const validEmp = globalDB.employees.filter(r => r[0] !== "姓名" && r[0] !== "");
            const opts = validEmp.map(r => `<option value="${r[0]}">${r[0]}</option>`).join('');
            document.getElementById('attName').innerHTML = opts; 
            document.getElementById('lvName').innerHTML = opts; 
            document.getElementById('prfName').innerHTML = opts;
            document.getElementById('lvAgent').innerHTML = `<option value="無">無</option>` + opts;
            const bound = localStorage.getItem('bound_user');
            if(bound) {
                document.getElementById('attName').value = bound; document.getElementById('attName').disabled = true;
                document.getElementById('lvName').value = bound; document.getElementById('lvName').disabled = true;
                document.getElementById('prfName').value = bound; document.getElementById('prfName').disabled = true;
                syncName(bound); 
            } else { syncName(document.getElementById('attName').value); }
            loadPendingProofs();
        } catch (e) { Swal.fire('錯誤', '連線失敗，請重新整理！', 'error'); } 
        finally { hideLoading(); }
    }

    function unlockDevice() {
        Swal.fire({ title: '解鎖設備', input: 'password', inputLabel: '請輸入 HR 專用密碼', showCancelButton: true, confirmButtonText: '解鎖'
        }).then((result) => {
            if (result.isConfirmed) {
                if(result.value === "456") { localStorage.removeItem('bound_user'); Swal.fire('成功', '已解除設備鎖定', 'success').then(() => location.reload()); } 
                else { Swal.fire('失敗', '密碼錯誤', 'error'); }
            }
        });
    }

    async function submitAttendance() {
        if (!isMobileDevice) { return Swal.fire({ icon: 'error', title: '打卡失敗', text: '系統偵測您並非使用行動裝置。' }); }
        const name = document.getElementById('attName').value;
        const type = document.querySelector('input[name="attType"]:checked').value;
        const overtimeReason = document.getElementById('overtimeReason') ? document.getElementById('overtimeReason').value : "";
        if ((selectedStatus.includes("加班") || selectedStatus.includes("值班")) && !overtimeReason.trim()) return Swal.fire('提示', '請填寫事由', 'warning');
        let finalStatus = selectedStatus;
        if (isHolidayToday()) { finalStatus = `【${document.getElementById('holidayType').value}】` + selectedStatus; }
        showLoading("打卡資料傳送中...");
        try {
            const response = await fetch(API_URL, { 
                method: 'POST', body: JSON.stringify({ action: "write", sheetName: "attendance", name: name, type: type, status: finalStatus, reason: overtimeReason, lat: userLat || "", lon: userLon || "" }) 
            });
            const result = await response.text();
            
            if (result === "Duplicate") { Swal.fire('注意', `${name}，您剛剛已經打過卡了喔！請勿在5分鐘內連續重複點擊！`, 'warning'); } 
            else if (result === "Success") {
                if (!localStorage.getItem('bound_user')) localStorage.setItem('bound_user', name);
                Swal.fire('成功', '打卡成功！', 'success').then(() => location.reload());
            } else { Swal.fire('失敗', result, 'error'); }
        } catch (e) { Swal.fire('錯誤', '網路連線異常，請稍後再試！', 'error'); } 
        finally { hideLoading(); }
    }

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    // 🚀 新增：把特准放行的勾選狀態送給後台
    async function submitLeave() {
        const name = document.getElementById('lvName').value;
        const type = document.getElementById('lvType').value;
        const start = document.getElementById('lvStart').value;
        const end = document.getElementById('lvEnd').value;
        const reason = document.getElementById('lvReason').value;
        const agent = document.getElementById('lvAgent').value;
        const fileInput = document.getElementById('lvFile');
        const isOverride = document.getElementById('managerOverride').checked; // 抓取打勾狀態

        if (!start || !end) return Swal.fire('提示', '請選擇開始與結束時間！', 'warning');
        showLoading("假單上傳中...");
        
        // 將 managerOverride 加進送出的資料包中
        const p = { action: "write", sheetName: "leave", name: name, leaveType: type, start: start, end: end, reason: reason, agent: agent, imageFile: "", managerOverride: isOverride };
        
        try {
            if (fileInput.files.length > 0) {
                p.imageFile = await getBase64(fileInput.files[0]);
                p.mimeType = fileInput.files[0].type; p.fileName = fileInput.files[0].name;
            }
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(p) }); 
            const text = await res.text(); 
            
            // 如果遇到系統阻擋，跳出警告
            if (text.includes("系統阻擋")) {
                Swal.fire('休假人數達上限', text, 'error');
            } else if (text === "Success") { 
                Swal.fire('成功', '假單送出成功！', 'success').then(() => location.reload()); 
            } else { 
                Swal.fire('失敗', text, 'error'); 
            }
        } catch(e) { Swal.fire('錯誤', '網路異常，請稍後再試。', 'error'); } 
        finally { hideLoading(); }
    }

    function loadPendingProofs() {
        const name = document.getElementById('prfName').value;
        const sel = document.getElementById('prfSelect'); sel.innerHTML = "";
        if (!globalDB || !globalDB.leave) return;
        const pending = globalDB.leave.filter(r => r[2] === name && r[9] === "待補件");
        if (pending.length === 0) { sel.innerHTML = "<option value=''>✅ 您目前沒有缺件的假單</option>"; } 
        else { pending.forEach(r => { sel.innerHTML += `<option value="${r[0]}">${r[4]} (${new Date(r[5]).toLocaleDateString()})</option>`; }); }
    }

    async function submitProof() {
        const rowIdx = document.getElementById('prfSelect').value;
        const fileInput = document.getElementById('prfFile');
        if (!rowIdx) return Swal.fire('提示', '沒有需要補件的紀錄', 'warning');
        if (fileInput.files.length === 0) return Swal.fire('提示', '請選擇要上傳的照片！', 'warning');
        showLoading("照片上傳中...");
        try {
            const p = { action: "uploadLeaveProof", id: rowIdx, imageFile: await getBase64(fileInput.files[0]), mimeType: fileInput.files[0].type, fileName: fileInput.files[0].name };
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(p) }); 
            const text = await res.text(); 
            if (text === "Success") { Swal.fire('成功', '補件成功！', 'success').then(() => location.reload()); } 
            else { Swal.fire('失敗', text, 'error'); }
        } catch (e) { Swal.fire('錯誤', '網路異常，請稍後再試。', 'error'); } 
        finally { hideLoading(); }
    }

    function switchTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-content').forEach(c => c.classList.remove('active'));
        event.currentTarget.classList.add('active'); document.getElementById(id).classList.add('active');
    }

    window.onload = () => {
        fetchEmployees(); 
        handleTypeChange();
        if(navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                userLat = pos.coords.latitude; userLon = pos.coords.longitude;
                isWithinRange = getDistance(userLat, userLon, TARGET_LAT, TARGET_LON) <= ALLOWED_DIST;
                updateGPSUI(); 
            }, error => {
                userLat = null; userLon = null; updateGPSUI();
            }, { enableHighAccuracy: true });
        } else { updateGPSUI(); }
    };
</script>
