<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 專業管理後台 V19.13 (新增部門版)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --warning: #f4b400; --danger: #d93025; --text-main: #3c4043; --text-sub: #70757a; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f3f4; color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1350px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); margin-bottom: 25px; }
        h1 { color: var(--text-main); font-size: 20px; font-weight: 500; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .top-nav { background: #202124; color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; gap: 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap;}
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #e8f0fe; color: var(--primary); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; } 
        th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #eee; color: var(--text-sub); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; } 
        .main-info { font-size: 15px; font-weight: 600; color: #202124; }
        .sub-info { font-size: 12px; color: var(--text-sub); margin-top: 4px;}
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; color: white !important; }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-primary { background: #1a73e8; }
        .btn-danger { background: #d93025; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #f4b400; }
        .btn-edit { background: white; border: 1px solid #dadce0; color: var(--text-main) !important; }

        .hr-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .action-group { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:#1a73e8;">處理中，請稍候...</div></div>

<div class="container top-nav">
    <div style="font-size:18px; font-weight:bold;">禾禾園 · 專業後台系統</div>
    <div class="nav-actions">
        <select id="adminRole" onchange="authRole()" style="background:#3c4043; color:white; border:none; padding:10px; border-radius:6px; outline:none; font-size:14px; cursor:pointer;">
            <option value="業務部主管">業務部主管</option><option value="生產部主管">生產部主管</option><option value="運輸部主管">運輸部主管</option><option value="倉儲部主管">倉儲部主管</option><option value="會計部主管">會計部主管</option><option value="人事部">人事部</option><option value="副總">副總</option>
        </select>
        <button class="btn btn-primary" onclick="fetchData()">🔄 同步雲端資料</button>
    </div>
</div>

<div id="hrBox" class="container" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h1 style="margin:0;">👥 員工人事維護與薪資調整</h1>
        <button class="btn btn-edit" style="color:var(--danger) !important; font-weight:bold;" onclick="changeAdminPassword()">🔑 更換管理密碼</button>
    </div>

    <div style="background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #cce0ff;">
        <div style="flex: 1; min-width: 200px;">
            <label style="font-weight:bold; color:#1a73e8; display:block; margin-bottom:5px;">1. 選擇部門</label>
            <select id="filterDept" onchange="updateEmpDropdown()" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; font-weight:bold;">
                <option value="">顯示全公司...</option>
                <option value="業務部">業務部</option><option value="倉儲部">倉儲部</option><option value="運輸部">運輸部</option><option value="生產部">生產部</option><option value="行政部">行政部</option><option value="會計部">會計部</option>
                <option value="採購部">採購部</option><option value="業務助理行政部">業務助理行政部</option>
            </select>
        </div>
        <div style="flex: 1; min-width: 200px;">
            <label style="font-weight:bold; color:#1a73e8; display:block; margin-bottom:5px;">2. 選擇員工 (細部微調)</label>
            <select id="filterEmp" onchange="loadEmpDetails()" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc;"><option value="">請先選擇部門...</option></select>
        </div>
        <div style="flex: 0.5; min-width: 120px; display: flex; align-items: flex-end;"><button class="btn btn-warning" onclick="clearForm()" style="width: 100%; height: 35px;">➕ 新增員工</button></div>
    </div>

    <div class="hr-form-grid">
        <div class="form-group"><label>員工姓名</label><input type="text" id="empName"></div>
        <div class="form-group"><label>所屬部門</label><select id="empDept"><option>業務部</option><option>倉儲部</option><option>運輸部</option><option>生產部</option><option>行政部</option><option>會計部</option><option>採購部</option><option>業務助理行政部</option></select></div>
        <div class="form-group"><label>計薪類別</label><select id="payType"><option>月薪</option><option>時薪</option></select></div>
        <div class="form-group"><label>基本薪資 (底薪)</label><input type="number" id="empSalary"></div>
        <div class="form-group"><label>到職日期</label><input type="date" id="obDate"></div>
        <div class="form-group"><label>變動獎金 (月)</label><input type="number" id="bonus" value="0"></div>
        <div class="form-group"><label>勞保自付額</label><input type="number" id="laborIns" value="0"></div>
        <div class="form-group"><label>健保自付額</label><input type="number" id="healthIns" value="0"></div>
        <div class="form-group"><label>健保眷屬人數</label><input type="number" id="dependents" value="0"></div>
        <div class="form-group" style="display:flex; align-items:flex-end;"><button class="btn btn-success" onclick="saveEmployee()" style="width: 100%; height: 42px;">💾 儲存修改</button></div>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead><tr><th>姓名</th><th>部門</th><th>薪資/類別</th><th>到職日</th><th>特休 (總/剩)</th><th>操作</th></tr></thead>
            <tbody id="staffBody"></tbody>
        </table>
    </div>
</div>

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
        <h1 style="margin:0;">📝 假單審核中心</h1>
        <div style="background:#e8f0fe; padding:8px 15px; border-radius:8px; border:1px solid #cce0ff; display:flex; align-items:center; gap:10px;">
            <label style="font-weight:bold; color:#1a73e8; font-size:14px;">🔍 篩選部門：</label>
            <select id="leaveDeptFilter" onchange="render()" style="padding:6px 10px; border-radius:6px; border:1px solid #1a73e8; outline:none; font-weight:bold; color:#1a73e8; cursor:pointer;">
                <option value="">顯示全公司假單</option>
                <option value="業務部">業務部</option><option value="倉儲部">倉儲部</option><option value="運輸部">運輸部</option><option value="生產部">生產部</option><option value="行政部">行政部</option><option value="會計部">會計部</option>
                <option value="採購部">採購部</option><option value="業務助理行政部">業務助理行政部</option>
            </select>
        </div>
    </div>
    <div class="tab-container"><button id="tab-pending" class="tab-btn active" onclick="switchTab('pending')">🔴 待處理假單</button><button id="tab-history" class="tab-btn" onclick="switchTab('history')">⚪ 歷史紀錄</button></div>
    <div class="table-responsive"><table><thead><tr><th>申請資訊</th><th>起訖時間</th><th>假別</th><th>證明文件</th><th>狀態</th><th>核准操作</th></tr></thead><tbody id="leaveBody"></tbody></table></div>
</div>

<div id="salaryBox" class="container" style="display:none; background-color: #fffaf0; border: 2px solid #ffc107;">
    <h1 style="color: #d35400; border-left: 5px solid #d35400; padding-left:15px; margin-top:0;">💰 月底薪資結算與報表匯出</h1>
    
    <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
        
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="background:#fef5e7; padding:10px 15px; border-radius:8px; border:1px solid #f9e79f;">
                <label style="font-weight:bold; color:#d35400; font-size: 16px; margin-right:10px;">📅 選擇結算月份</label>
                <input type="month" id="salaryMonth" onchange="renderSalary()" style="padding:8px; border-radius:6px; border:1px solid #ccc; font-weight:bold; font-size: 15px; outline:none; cursor:pointer;">
            </div>
        </div>

        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <button class="btn btn-primary" style="height: 45px; padding: 0 25px;" onclick="calculateSalary()">⚙️ 1. 執行薪資結算</button>
            <button class="btn btn-danger" style="height: 45px; padding: 0 25px;" onclick="generatePDF()">📄 2. 產出 PDF 薪資單</button>
            <button class="btn btn-success" style="height: 45px; padding: 0 25px;" onclick="exportExcel()">📊 3. 下載 Excel 報表</button>
        </div>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead><tr style="background:#f8f9fa;"><th>結算月份</th><th>姓名</th><th>部門</th><th>總工時</th><th>基本薪資</th><th>遲到/請假扣款</th><th>實發總計</th></tr></thead>
            <tbody id="salaryBody"></tbody>
        </table>
    </div>
</div>

<script>
    const CONFIG_URL = "https://script.google.com/macros/s/AKfycbw33nAqelLWJFWD4Sv1mfNLhBfLYPoC9fwYl80WUcJMuum-59xB8gJR_94IS11a-0wkOA/exec";
    let db = {}; let currentTab = 'pending';

    function formatShortTime(timeStr) {
        if (!timeStr) return ""; const d = new Date(timeStr); if (isNaN(d.getTime())) return String(timeStr);
        const pad = (n) => n.toString().padStart(2, '0');
        return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showLoading(t){ document.getElementById('loadingText').innerText=t; document.getElementById('loadingOverlay').style.display='flex'; }
    function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }

    function switchTab(tab) { currentTab = tab; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-' + tab).classList.add('active'); render(); }

    function authRole() {
        const r = document.getElementById('adminRole').value;
        const correctPwd = db.adminPassword || "123";
        if((r==='人事部' || r==='副總') && prompt("安全管理驗證，請輸入密碼：") !== correctPwd) { 
            alert("❌ 密碼錯誤！"); document.getElementById('adminRole').value="業務部主管"; 
        }
        render();
    }

    async function fetchData() { 
        showLoading("獲取最新資料...");
        try { const res = await fetch(CONFIG_URL); db = await res.json(); render(); renderSalary(); } catch(e) { alert("連線失敗"); } finally { hideLoading(); }
    }

    function render() {
        const role = document.getElementById('adminRole').value;
        const hrBox = document.getElementById('hrBox');
        const salaryBox = document.getElementById('salaryBox');
        if (role === '人事部' || role === '副總') { hrBox.style.display = 'block'; salaryBox.style.display = 'block'; renderStaff(document.getElementById('filterDept').value); } else { hrBox.style.display = 'none'; salaryBox.style.display = 'none'; }

        if(db.leave) {
            let leaveData = db.leave.filter(r => r[0] && r[0] !== "ID" && r[0] !== "單號 (ID)");
            const leaveFilter = document.getElementById('leaveDeptFilter').value;
            if (leaveFilter) { leaveData = leaveData.filter(r => String(r[3] || "") === leaveFilter); }
            leaveData.sort((a, b) => new Date(b[5]).getTime() - new Date(a[5]).getTime());

            if (currentTab === 'pending') { 
                leaveData = leaveData.filter(r => String(r[8] || "").includes('待')); 
            } else { 
                leaveData = leaveData.filter(r => String(r[8] || "").includes('已') || !String(r[8] || "").includes('待')); 
            }

            document.getElementById('leaveBody').innerHTML = leaveData.map(r => {
                let next = '';
                let targetRole = String(r[3] || ""); 
                if (targetRole === '運輸部') { targetRole = '會計部'; }
                let status = String(r[8] || "");

                if (targetRole && role.includes(targetRole.replace('部','')) && status === '待主管審核') {
                    next = '待副總審核';
                } else if (role === '副總' && (status === '待副總審核' || status === '待人事審核' || status === '待人事核銷')) {
                    next = '已生效';
                }
                
                let agentText = r[10] && r[10] !== "無" ? `<div class="sub-info" style="color:#1a73e8; font-weight:bold;">🤝 代理人：${r[10]}</div>` : '';
                let reasonText = r[7] ? `<div class="sub-info">📝 事由：${r[7]}</div>` : '';
                let proofUrl = r[9] ? String(r[9]).trim() : "";
                let proof = proofUrl.includes('http') ? `<a href="${proofUrl}" target="_blank" class="proof-btn">📎 查看</a>` : (proofUrl === "待補件" ? "⚠️ 待補件" : "無");
                
                let actionBtn = "-";
                if (next && currentTab === 'pending') {
                    actionBtn = `
                        <div class="action-group">
                            <button class="btn btn-success" onclick="updLv('${r[0]}','${next}')">✔️ 核准</button>
                            <button class="btn btn-danger" onclick="rejectLeave('${r[0]}')">❌ 退回</button>
                        </div>
                    `;
                }

                return `<tr><td><div class="main-info">${r[2] || "未知"} <small>(${r[3] || "未知"})</small></div>${agentText}${reasonText}</td><td><div style="font-size:13px;">${formatShortTime(r[5])}<br>~<br>${formatShortTime(r[6])}</div></td><td><b>${r[4] || ""}</b></td><td>${proof}</td><td><span style="color:#1a73e8;font-weight:bold;">${status}</span></td><td>${actionBtn}</td></tr>`;
            }).join('') || '<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa;">無資料</td></tr>';
        }
    }

    function renderStaff(filterDept = "") {
        if(!db.employees) return;
        let staffData = db.employees.filter(r => r[0] && r[0] !== "姓名");
        if (filterDept) { staffData = staffData.filter(r => r[1] === filterDept); }
        document.getElementById('staffBody').innerHTML = staffData.map(r => {
            let total = Number(r[5]) || 0; let used = 0;
            if (db.leave) { db.leave.forEach(lv => { if (lv[2] === r[0] && lv[4] === "特休" && lv[8] === "已生效") { let days = (new Date(lv[6]) - new Date(lv[5])) / 86400000; used += Math.max(0.5, Math.ceil(days * 2) / 2); } }); }
            
            return `<tr>
                <td><b>${r[0] || ""}</b></td>
                <td><span style="background:#f1f3f4; padding:4px 8px; border-radius:4px; font-size:12px; font-weight:bold; color:#5f6368;">${r[1] || ""}</span></td>
                <td>$${r[3] || 0}</td>
                <td>${r[4] ? new Date(r[4]).toLocaleDateString() : '-'}</td>
                <td><b>${total} / ${Math.max(0, total-used)}</b></td>
                <td>
                    <button class="btn btn-edit" style="padding:4px 8px;" onclick="quickEdit('${r[0]}', '${r[1] || ""}')">編輯</button>
                    <button class="btn btn-danger" style="padding:4px 8px; margin-left:5px;" onclick="deleteEmp('${r[0]}')">刪除</button>
                </td>
            </tr>`;
        }).join('');
    }

    function updateEmpDropdown() {
        const dept = document.getElementById('filterDept').value; const empSelect = document.getElementById('filterEmp');
        empSelect.innerHTML = '<option value="">請選擇員工...</option>'; renderStaff(dept);
        if (dept && db.employees) { db.employees.filter(r => String(r[1] || "") === dept).forEach(r => { empSelect.innerHTML += `<option value="${r[0]}">${r[0]}</option>`; }); }
    }

    function loadEmpDetails() {
        const name = document.getElementById('filterEmp').value; if (!name) return clearForm();
        const emp = db.employees.find(r => r[0] === name);
        if (emp) {
            document.getElementById('empName').value = emp[0] || ""; document.getElementById('empDept').value = emp[1] || ""; document.getElementById('payType').value = emp[2] || "月薪";
            document.getElementById('empSalary').value = emp[3] || 0; document.getElementById('obDate').value = emp[4] ? new Date(emp[4]).toISOString().split('T')[0] : "";
            document.getElementById('bonus').value = emp[6] || 0; document.getElementById('laborIns').value = emp[7] || 0; document.getElementById('healthIns').value = emp[8] || 0; document.getElementById('dependents').value = emp[9] || 0;
        }
    }

    function quickEdit(n, d) { document.getElementById('filterDept').value = d; updateEmpDropdown(); document.getElementById('filterEmp').value = n; loadEmpDetails(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function clearForm() { ['empName','empSalary','obDate'].forEach(id => document.getElementById(id).value = ""); ['bonus','laborIns','healthIns','dependents'].forEach(id => document.getElementById(id).value = "0"); document.getElementById('filterEmp').value = ""; }

    async function saveEmployee() {
        const p = { action: "saveEmployee", name: document.getElementById('empName').value, dept: document.getElementById('empDept').value, payType: document.getElementById('payType').value, salary: document.getElementById('empSalary').value, onboardingDate: document.getElementById('obDate').value, bonus: document.getElementById('bonus').value, laborIns: document.getElementById('laborIns').value, healthIns: document.getElementById('healthIns').value, dependents: document.getElementById('dependents').value };
        if(!p.name || !p.salary) return alert("姓名與薪資必填！");
        showLoading("儲存中..."); await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify(p) }); alert("✅ 儲存成功"); fetchData(); clearForm();
    }

    async function updLv(id, s) { showLoading("審核中..."); await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updateLeave", id: id, newStatus: s })}); fetchData(); alert("✅ 審核完成"); }

    async function rejectLeave(id) { 
        if(!confirm("確定要退回這張假單嗎？\n退回後，系統會通知該員工，並自動在 Google 日曆上將此假單標示為「已退回」。")) return;
        showLoading("退件處理中..."); 
        await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updateLeave", id: id, newStatus: "已退回" })}); 
        fetchData(); 
        alert("❌ 假單已退回！"); 
    }

    async function changeAdminPassword() {
        const newPwd = prompt("請設定新的管理員密碼："); if (!newPwd) return;
        if (confirm(`確定要將密碼更新為 [ ${newPwd} ] 嗎？`)) { showLoading("同步至雲端中..."); try { await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updatePassword", newPassword: newPwd })}); alert("✅ 密碼更新成功！"); location.reload(); } catch (e) { alert("更新失敗"); hideLoading(); } }
    }

    async function deleteEmp(name) {
        if(!confirm(`⚠️ 警告：確定要刪除員工「${name}」的資料嗎？刪除後無法復原！`)) return;
        showLoading("刪除中...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "deleteEmployee", name: name })});
            alert("✅ 員工資料已成功刪除！");
            fetchData();
        } catch (e) { alert("刪除失敗，請檢查網路連線。"); hideLoading(); }
    }

    // ==========================================
    // 💰 薪資功能區 (升級 X光診斷版)
    // ==========================================
    function renderSalary() {
        const month = document.getElementById('salaryMonth').value;
        const tbody = document.getElementById('salaryBody');
        if (!month || !db.Salary_Summary) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#aaa;">請先選擇結算月份</td></tr>'; return; }
        const rows = db.Salary_Summary.filter(r => r[0] && String(r[0]).includes(month));
        if (rows.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#d93025;">此月份尚未結算，請點擊上方執行鈕</td></tr>'; return; }
        
        tbody.innerHTML = rows.map(r => {
            const totalDeduct = Number(r[13] || 0) + Number(r[16] || 0) + Number(r[19] || 0);
            return `<tr><td>${String(r[0] || "").replace(/'/g, "")}</td><td><b>${r[1] || ""}</b></td><td>${r[2] || ""}</td><td>${r[4] || 0} 小時</td><td>$${r[5] || 0}</td><td style="color:#d93025;">-$${totalDeduct}</td><td><h4 style="margin:0; color:#1a73e8;">$${r[22] || 0}</h4></td></tr>`;
        }).join('');
    }

    // 🌟 X 光診斷：顯示真正的錯誤訊息
    async function calculateSalary() {
        const m = document.getElementById('salaryMonth').value; if (!m) return alert("⚠️ 請選擇月份");
        if (!confirm(`確定執行 ${m} 月薪資結算？\n(將自動套用法定加班費率，並建立獨立存檔分頁！)`)) return;
        
        showLoading(`正在結算 ${m} 月薪資並建立獨立檔案...`);
        try { 
            const res = await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "calculateSalary", targetMonth: m }) }); 
            if (!res.ok) throw new Error(`無法連線到 Google (代碼 ${res.status})，請確認 Apps Script 有「建立新版本」！`);
            
            const text = await res.text();
            if (text !== "Success") throw new Error("大腦運算失敗：\n" + text);

            alert("✅ 結算完成！獨立月份檔案已於雲端建立。"); 
            await fetchData(); 
        } catch (e) { 
            alert("❌ 結算發生錯誤！\n\n原因：" + e.message); 
        } finally {
            hideLoading(); 
        }
    }

    // 🌟 X 光診斷：顯示真正的錯誤訊息
    async function generatePDF() {
        const m = document.getElementById('salaryMonth').value; if (!m) return alert("⚠️ 請選擇月份");
        showLoading(`正在生成 ${m} 月 PDF 薪資單...`);
        try { 
            const res = await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "generatePDF", targetMonth: m }) }); 
            if (!res.ok) throw new Error(`無法連線到 Google (代碼 ${res.status})，請確認 Apps Script 有「建立新版本」！`);
            
            const text = await res.text();
            if (text !== "Success") throw new Error("大腦產出 PDF 失敗：\n" + text);

            alert("✅ PDF 產生完畢！請至雲端硬碟查看。"); 
        } catch (e) { 
            alert("❌ PDF 產生錯誤！\n\n原因：" + e.message); 
        } finally { 
            hideLoading(); 
        }
    }

    function exportExcel() {
        const m = document.getElementById('salaryMonth').value; if (!m) return alert("⚠️ 請選擇月份");
        const headers = db.Salary_Summary[0]; const rows = db.Salary_Summary.filter(r => r[0] && String(r[0]).includes(m));
        if (rows.length === 0) return alert("⚠️ 尚未結算！");
        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "薪資報表"); XLSX.writeFile(wb, `禾禾園_${m}_薪資結算表.xlsx`);
    }

    fetchData();
</script>
