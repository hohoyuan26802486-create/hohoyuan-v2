<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 專業管理後台 V18.5 (HR + 假單審核全功能版)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --warning: #f4b400; --danger: #d93025; --text-main: #3c4043; --text-sub: #70757a; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f3f4; color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1350px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); margin-bottom: 25px; }
        h1 { color: var(--text-main); font-size: 20px; font-weight: 500; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        /* 導覽與頁籤 */
        .top-nav { background: #202124; color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; gap: 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #e8f0fe; color: var(--primary); }

        /* 表單與表格 */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; } 
        th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #eee; color: var(--text-sub); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; } 
        
        /* HR 專用表單樣式 */
        .hr-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; }

        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: #ffebee; color: #d93025; border: 1px solid #ffcdd2; }
        .proof-btn { background: #e8f0fe; color: #1a73e8; border: 1px solid #cce0ff; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 12px; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:#1a73e8;">處理中...</div></div>

<div class="container top-nav">
    <div style="font-size:18px; font-weight:bold;">禾禾園 · 專業後台系統</div>
    <div class="nav-actions">
        <select id="adminRole" onchange="authRole()" style="background:#3c4043; color:white; border:none; padding:10px; border-radius:6px; outline:none; font-size:14px; cursor:pointer;">
            <option value="業務部主管">業務部主管</option><option value="生產部主管">生產部主管</option><option value="運輸部主管">運輸部主管</option><option value="倉儲部主管">倉儲部主管</option><option value="會計部">會計部</option><option value="人事部">人事部</option><option value="副總">副總</option>
        </select>
        <button class="btn btn-primary" onclick="fetchData()">🔄 同步雲端資料</button>
    </div>
</div>

<div id="hrBox" class="container" style="display:none;">
    <h1>👥 員工人事維護</h1>
    <div class="hr-form-grid">
        <div class="form-group"><label>姓名</label><input type="text" id="empName"></div>
        <div class="form-group"><label>部門</label>
            <select id="empDept"><option>業務部</option><option>倉儲部</option><option>行政部</option><option>會計部</option><option>運輸部</option></select>
        </div>
        <div class="form-group"><label>計薪類別</label><select id="payType"><option>月薪</option><option>時薪</option></select></div>
        <div class="form-group"><label>基本薪資</label><input type="number" id="empSalary"></div>
        <div class="form-group"><label>到職日期</label><input type="date" id="obDate"></div>
        <div class="form-group"><label>固定獎金</label><input type="number" id="bonus" value="0"></div>
        <div class="form-group"><label>勞保自付</label><input type="number" id="laborIns" value="0"></div>
        <div class="form-group"><label>健保自付</label><input type="number" id="healthIns" value="0"></div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
            <button class="btn btn-success" onclick="saveEmployee()">💾 儲存員工資料</button>
        </div>
    </div>
    <div class="table-responsive">
        <table>
            <thead><tr><th>姓名</th><th>部門</th><th>計薪</th><th>薪資</th><th>到職日</th><th>剩餘特休</th><th>操作</th></tr></thead>
            <tbody id="staffBody"></tbody>
        </table>
    </div>
</div>

<div class="container">
    <h1>📝 假單審核中心</h1>
    <div class="tab-container">
        <button id="tab-pending" class="tab-btn active" onclick="switchTab('pending')">🔴 待處理假單</button>
        <button id="tab-history" class="tab-btn" onclick="switchTab('history')">⚪ 歷史紀錄</button>
    </div>
    <div class="table-responsive">
        <table>
            <thead><tr><th>申請資訊</th><th>起訖時間</th><th>假別</th><th>證明文件</th><th>狀態</th><th>核准操作</th></tr></thead>
            <tbody id="leaveBody"></tbody>
        </table>
    </div>
</div>

<script>
    const CONFIG_URL = "https://script.google.com/macros/s/AKfycbx0clQCOIOULOi58C0ffABTWNEwDa3KFVUF0TK9FCcj-O1aFLtxWkIF0IOv7bn_Wml4RA/exec";
    let db = {}; let currentTab = 'pending'; 

    function showLoading(t){ document.getElementById('loadingText').innerText=t; document.getElementById('loadingOverlay').style.display='flex'; }
    function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active'); render(); 
    }

    function authRole() {
        const r = document.getElementById('adminRole').value;
        if((r==='人事部' || r==='會計部' || r==='副總') && prompt("管理員身分核認，請輸入密碼：")!=="123") { 
            document.getElementById('adminRole').value="業務部主管"; 
        }
        render();
    }

    async function fetchData() { 
        showLoading("正在獲取最新雲端資料...");
        try { 
            const res = await fetch(CONFIG_URL); 
            db = await res.json(); 
            render(); 
        } catch(e) { alert("連線失敗，請檢查網路或 API 網址。"); } finally { hideLoading(); }
    }

    function render() {
        const role = document.getElementById('adminRole').value;
        const hrBox = document.getElementById('hrBox');

        // 控制 HR 介面顯示
        if (role === '人事部' || role === '會計部' || role === '副總') {
            hrBox.style.display = 'block';
            renderStaff();
        } else {
            hrBox.style.display = 'none';
        }

        // 渲染假單
        if(db.leave) {
            let leaveData = db.leave.filter(r => r[0] !== "ID" && r[0] !== "單號 (ID)" && r[0] !== "");
            leaveData.sort((a, b) => new Date(b[1]).getTime() - new Date(a[1]).getTime());

            if (currentTab === 'pending') {
                leaveData = leaveData.filter(r => r[8] && r[8].includes('待'));
            } else {
                leaveData = leaveData.filter(r => r[8] && (r[8].includes('已') || !r[8].includes('待')));
            }

            document.getElementById('leaveBody').innerHTML = leaveData.map(r => {
                let next = '';
                if (role.includes(r[3].replace('部','')) && r[8] === '待主管審核') next = '待副總審核';
                else if (role === '副總' && (r[8] === '待副總審核' || r[8] === '待人事審核')) next = '待人事核銷';
                else if (role === '人事部' && r[8] === '待人事核銷') next = '已生效';
                
                let proofUrl = r[9] ? String(r[9]).trim() : "";
                let proof = proofUrl.includes('http') ? `<a href="${proofUrl}" target="_blank" class="proof-btn">📎 查看單據</a>` : (proofUrl === "待補件" ? "⚠️ 待補件" : "無");
                let actionBtn = (next && currentTab === 'pending') ? `<button class="btn btn-success" onclick="updLv('${r[0]}','${next}')">核准</button>` : "-";

                return `<tr>
                    <td><div class="main-info">${r[2]} <small>(${r[3]})</small></div><div style="font-size:12px;color:#70757a;">📝 ${r[7] || '未填事由'}</div></td>
                    <td><small>${r[5]}<br>~<br>${r[6]}</small></td>
                    <td><b>${r[4]}</b></td>
                    <td>${proof}</td>
                    <td><span style="color:#1a73e8;font-weight:bold;">${r[8]}</span></td>
                    <td>${actionBtn}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa;">無資料</td></tr>';
        }
    }

    function renderStaff() {
        if(!db.employees) return;
        const staffData = db.employees.filter(r => r[0] !== "姓名" && r[0] !== "");
        document.getElementById('staffBody').innerHTML = staffData.map(r => `
            <tr>
                <td><b>${r[0]}</b></td>
                <td>${r[1]}</td>
                <td>${r[2]}</td>
                <td>$${r[3]}</td>
                <td>${r[4] ? new Date(r[4]).toLocaleDateString() : '-'}</td>
                <td>${r[5] || 0} 天</td>
                <td><button class="btn btn-danger" onclick="deleteEmp('${r[0]}')">刪除</button></td>
            </tr>
        `).join('');
    }

    async function saveEmployee() {
        const payload = {
            action: "saveEmployee",
            name: document.getElementById('empName').value,
            dept: document.getElementById('empDept').value,
            payType: document.getElementById('payType').value,
            salary: document.getElementById('empSalary').value,
            onboardingDate: document.getElementById('obDate').value,
            bonus: document.getElementById('bonus').value,
            laborIns: document.getElementById('laborIns').value,
            healthIns: document.getElementById('healthIns').value
        };
        if(!payload.name || !payload.salary) return alert("姓名與薪資為必填！");
        showLoading("儲存員工資料中...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("✅ 儲存成功！"); fetchData();
        } catch(e) { alert("儲存失敗"); hideLoading(); }
    }

    async function updLv(id, s) {
        if(!confirm(`確認核准此假單並送交下一級：${s} ？`)) return;
        showLoading("審核中...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updateLeave", id: id, newStatus: s })});
            fetchData(); alert("✅ 審核成功！");
        } catch (e) { alert("發生錯誤"); hideLoading(); }
    }

    async function deleteEmp(name) {
        if(!confirm(`確定要刪除員工：${name}？此動作無法復原！`)) return;
        showLoading("正在刪除資料...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "deleteEmployee", name: name })});
            fetchData(); alert("✅ 已成功刪除。");
        } catch (e) { alert("刪除失敗"); hideLoading(); }
    }

    fetchData();
</script>
</body>
</html>
