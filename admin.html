<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 專業管理後台 V14.8</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --warning: #f4b400; --danger: #d93025; --text-main: #3c4043; --text-sub: #70757a; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f3f4; color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1350px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); margin-bottom: 25px; }
        h1 { color: var(--text-main); font-size: 20px; font-weight: 500; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap;}
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn:hover { background: #f1f3f4; }
        .tab-btn.active { background: #e8f0fe; color: var(--primary); }

        .dept-select-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #eee;}
        .dept-select { padding: 8px 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 15px; font-weight: bold; color: var(--primary); outline: none; background-color: white; cursor: pointer; min-width: 180px;}
        .dept-select:hover { border-color: var(--primary); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; } 
        th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #eee; color: var(--text-sub); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; } 
        
        .main-info { font-size: 15px; font-weight: 600; color: #202124; }
        .sub-info { font-size: 12px; color: var(--text-sub); }
        .ins-highlight { font-size: 17px; font-weight: bold; color: #000; }
        .bonus-text { color: var(--success); font-weight: bold; font-size: 13px; margin-top: 4px; }

        .proof-btn { 
            display: inline-flex; align-items: center; background: #e8f0fe; color: #1a73e8 !important; 
            border: 1px solid #cce0ff; padding: 6px 12px; border-radius: 20px; text-decoration: none;
            font-size: 13px; font-weight: bold; transition: 0.2s;
        }
        .proof-btn:hover { background: #d2e3fc; border-color: #1a73e8; }

        .form-row { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; background: var(--bg-gray); padding: 20px; border-radius: 12px;}
        .input-group { display: flex; flex-direction: column; flex: 1 1 150px; }
        .input-group label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
        .input-group input, .input-group select { padding: 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 14px; outline:none; }
        
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: #ffebee; color: #d93025; border: 1px solid #ffcdd2; }
        .btn-danger:hover { background: #ffcdd2; }
        .btn-edit { background: white; border: 1px solid #dadce0; color: var(--text-main); }
        .btn-edit:hover { background: #f8f9fa; }
        
        .top-nav { background: #202124; color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; gap: 15px; }
        .nav-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            .top-nav { flex-direction: column; align-items: stretch; text-align: center; padding: 15px; }
            .nav-actions { display: flex; width: 100%; justify-content: space-between; gap: 10px; margin-top: 5px; }
            .nav-actions select { flex: 1; min-width: 100px; }
            .nav-actions button { flex: 1; min-width: 120px; white-space: nowrap; }
        }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:#1a73e8;">處理中，請稍候...</div></div>

<div class="container top-nav">
    <div style="font-size:18px; font-weight:bold;">禾禾園 · 專業後台系統</div>
    <div class="nav-actions">
        <select id="adminRole" onchange="authRole()" style="background:#3c4043; color:white; border:none; padding:10px; border-radius:6px; outline:none; font-size:14px;">
            <option value="業務部主管">業務部主管</option>
            <option value="生產部主管">生產部主管</option>
            <option value="運輸部主管">運輸部主管</option>
            <option value="倉儲部主管">倉儲部主管</option>
            <option value="會計部">會計部</option>
            <option value="人事部">人事部</option>
            <option value="副總">副總</option>
        </select>
        <button class="btn btn-primary" onclick="fetchData()">🔄 同步雲端資料</button>
    </div>
</div>

<div id="hrBox" class="container" style="display:none;">
    <h1>👥 員工名冊管理</h1>
    <div class="form-row" id="employeeForm">
        <div class="input-group"><label>姓名</label><input type="text" id="eName"></div>
        <div class="input-group"><label>部門</label><select id="eDept"><option>業務部</option><option>會計部</option><option>生產部</option><option>運輸部</option><option>倉儲部</option><option>人事部</option><option>採購部</option><option>品管部</option><option>主管人員</option></select></div>
        <div class="input-group"><label>到職日</label><input type="date" id="eDate"></div>
        <div class="input-group"><label>底薪</label><input type="number" id="eSal"></div>
        <div class="input-group"><label>變動獎金</label><input type="number" id="eBonus" value="0"></div>
        <div class="input-group"><label>勞保</label><input type="number" id="eLabor" value="0"></div>
        <div class="input-group"><label>健保</label><input type="number" id="eHealth" value="0"></div>
        <div class="input-group"><label>健保眷屬</label><input type="number" id="eDependents" value="0"></div>
        <div style="display:flex; align-items:flex-end;">
            <button id="saveBtn" class="btn btn-primary" onclick="saveEmp()">💾 儲存設定</button>
            <button id="cancelBtn" class="btn btn-edit" style="display:none; margin-left:10px;" onclick="cancelEdit()">❌ 取消</button>
        </div>
    </div>
    
    <div id="deptFilters" class="dept-select-container"></div>
    
    <div class="table-responsive"><table><thead><tr><th>員工</th><th>特休天數</th><th>薪資/獎金</th><th>勞健保</th><th>操作</th></tr></thead><tbody id="empBody"></tbody></table></div>
</div>

<div class="container">
    <h1>📝 假單審核中心</h1>
    <div class="tab-container">
        <button id="tab-pending" class="tab-btn active" onclick="switchTab('pending')">🔴 待處理假單</button>
        <button id="tab-history" class="tab-btn" onclick="switchTab('history')">⚪ 歷史紀錄</button>
    </div>
    <div class="table-responsive"><table><thead><tr><th>申請人</th><th>起訖時間</th><th>假別</th><th>證明文件</th><th>狀態</th><th>核准操作</th></tr></thead><tbody id="leaveBody"></tbody></table></div>
</div>

<div id="reportBox" class="container" style="display:none;">
    <h1>📊 結算與報表</h1>
    <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
        <input type="month" id="rMonth" style="padding:10px; border-radius:8px; border:1px solid #ccc;">
        <button class="btn btn-primary" onclick="calcSalary()">🧮 1. 結算薪資</button>
        <button class="btn btn-success" onclick="exportExcel()">📥 2. 匯出 Excel</button>
        <button class="btn btn-warning" onclick="makePDF()">📄 3. 生成 PDF</button>
    </div>
</div>

<script>
    const CONFIG_URL = "https://script.google.com/macros/s/AKfycbx0clQCOIOULOi58C0ffABTWNEwDa3KFVUF0TK9FCcj-O1aFLtxWkIF0IOv7bn_Wml4RA/exec";
    let db = {}; let editingEmpName = null;
    let currentTab = 'pending'; 
    let currentDeptFilter = '全部'; 

    function formatShortTime(timeStr) {
        if (!timeStr) return "";
        const d = new Date(timeStr); if (isNaN(d)) return timeStr;
        const pad = (n) => n.toString().padStart(2, '0');
        return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatTime(timeStr) { 
        if (!timeStr) return "";
        const d = new Date(timeStr); if (isNaN(d)) return timeStr;
        const pad = (n) => n.toString().padStart(2, '0');
        return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showLoading(t){ document.getElementById('loadingText').innerText=t; document.getElementById('loadingOverlay').style.display='flex'; }
    function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        render(); 
    }

    function setDeptFilter(dept) {
        currentDeptFilter = dept;
        render(); 
    }

    function authRole() {
        const r = document.getElementById('adminRole').value;
        if((r==='人事部' || r==='會計部' || r==='副總') && prompt("請輸入管理員密碼")!=="123") {
            document.getElementById('adminRole').value="業務部主管";
        }
        render();
    }

    async function fetchData() { 
        showLoading("正在獲取最新資料...");
        try { 
            const res = await fetch(CONFIG_URL); 
            db = await res.json(); 
            render(); 
        } catch(e) {
            alert("網路連線異常，請確認網址或重整頁面。");
        } finally { hideLoading(); }
    }

    function render() {
        const role = document.getElementById('adminRole').value;
        const isHR = role === '人事部' || role === '副總';
        document.getElementById('hrBox').style.display = isHR ? 'block' : 'none';
        document.getElementById('reportBox').style.display = (isHR || role === '會計部') ? 'block' : 'none';

        if(db.employees) {
            let depts = ["全部"];
            db.employees.forEach(r => {
                if (r[1] && r[0] !== "姓名" && r[0] !== "" && !depts.includes(r[1])) {
                    depts.push(r[1]); 
                }
            });
            
            let optionsHTML = depts.map(d => 
                `<option value="${d}" ${currentDeptFilter === d ? 'selected' : ''}>${d === '全部' ? '顯示全部員工' : d}</option>`
            ).join('');
            
            document.getElementById('deptFilters').innerHTML = `
                <label for="deptSelect" style="font-size:14px; font-weight:bold; color:var(--text-sub);">🎯 部門篩選：</label>
                <select id="deptSelect" class="dept-select" onchange="setDeptFilter(this.value)">
                    ${optionsHTML}
                </select>
            `;

            let empList = db.employees.filter(r => r[0] !== "姓名" && r[0] !== "");
            if (currentDeptFilter !== '全部') {
                empList = empList.filter(r => r[1] === currentDeptFilter);
            }

            document.getElementById('empBody').innerHTML = empList.map(r => {
                const used = db.leave ? db.leave.filter(l => l[2] === r[0] && l[4] === "特休" && l[8] === "已生效").length : 0;
                return `<tr>
                    <td><div class="main-info">${r[0]}</div><div class="sub-info">${r[1]} · ${r[4]?formatTime(r[4]).split(' ')[0]:''}</div></td>
                    <td><div class="ins-highlight" style="color:#d93025;">剩 ${Number(r[5])-used} 天</div><div class="sub-info">總額 ${r[5]} 天</div></td>
                    <td><div class="ins-highlight">$${r[3]}</div><div class="bonus-text">獎金: $${r[6]||0}</div></td>
                    <td><div class="sub-info">勞保: <strong>$${r[7]||0}</strong></div><div class="sub-info">健保: <strong>$${r[8]||0}</strong> (${r[9]||0}口)</div></td>
                    <td>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-edit" onclick="startEdit('${r[0]}','${r[1]}','${r[3]}','${r[4]}','${r[7]}','${r[8]}','${r[9]}','${r[6]}')">✏️ 修改</button>
                            <button class="btn btn-danger" onclick="deleteEmp('${r[0]}')">🗑️ 刪除</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
            
            if (empList.length === 0) {
                document.getElementById('empBody').innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px; color:#70757a;">目前「${currentDeptFilter}」沒有員工資料</td></tr>`;
            }
        }

        if(db.leave) {
            let leaveData = db.leave.filter(r => r[0] !== "ID" && r[0] !== "").reverse();

            if (currentTab === 'pending') {
                leaveData = leaveData.filter(r => r[8] && r[8].includes('待'));
            } else {
                leaveData = leaveData.filter(r => r[8] && (r[8].includes('已') || !r[8].includes('待'))); 
            }

            let tableHTML = leaveData.map(r => {
                let next = (role.includes(r[3]) && r[8]==='待主管審核') ? '待人事審核' : (role==='人事部' && r[8]==='待人事審核') ? '待副總審核' : (role==='副總' && r[8]==='待副總審核') ? '已生效' : '';
                
                // 🌟 強化版防呆抓取：確保就算格式奇怪也不會當機，並換上醒目藍色按鈕
                let proofUrl = r[9] ? String(r[9]).trim() : "";
                let proof = (proofUrl.includes('http')) ? `<a href="${proofUrl}" target="_blank" class="proof-btn">📎 點擊查看單據</a>` : `<span style="color:#ccc">無</span>`;
                
                let statusColor = r[8] === '已生效' ? '#28a745' : (r[8].includes('退') ? '#d93025' : '#f4b400');
                let actionBtn = (next && currentTab === 'pending') ? `<button class="btn btn-success" onclick="updLv('${r[0]}','${next}')">核准</button>` : `<span style="color:#ccc">-</span>`;

                return `<tr>
                    <td><div class="main-info">${r[2]} <span class="sub-info">(${r[3]})</span></div></td>
                    <td><div style="font-size:13px; color:#3c4043;">${formatShortTime(r[5])} <span style="color:#aaa;">~</span> ${formatShortTime(r[6])}</div></td>
                    <td>${r[4]}</td>
                    <td>${proof}</td>
                    <td><span style="font-weight:bold; color:${statusColor}">${r[8]}</span></td>
                    <td>${actionBtn}</td>
                </tr>`;
            }).join('');

            if (leaveData.length === 0) {
                tableHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:#70757a; font-size:15px;">🎉 太棒了！目前沒有${currentTab === 'pending' ? '需要待處理' : '歷史'}的假單資料</td></tr>`;
            }

            document.getElementById('leaveBody').innerHTML = tableHTML;
        }
    }

    async function updLv(id, s) {
        if(!confirm(`確認核准狀態為：${s} ？`)) return;
        showLoading("核准處理中，請稍候...");
        const timeout = setTimeout(() => { hideLoading(); alert("⚠️ 伺服器回應較慢，已為您解除等待。請重按「同步」確認狀態。"); }, 15000);
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updateLeave", id: id, newStatus: s })});
            clearTimeout(timeout); await fetchData(); alert("✅ 審核完成！");
        } catch (e) { clearTimeout(timeout); hideLoading(); alert("發生錯誤，請重試"); }
    }

    function startEdit(name, dept, sal, date, labor, health, dependents, bonus) {
        editingEmpName = name; document.getElementById('eName').value = name; document.getElementById('eName').disabled = true;
        document.getElementById('eDept').value = dept; document.getElementById('eSal').value = sal;
        if(date) document.getElementById('eDate').value = new Date(date).toISOString().split('T')[0];
        document.getElementById('eLabor').value = labor; document.getElementById('eHealth').value = health;
        document.getElementById('eDependents').value = dependents; document.getElementById('eBonus').value = bonus;
        document.getElementById('saveBtn').innerText = "💾 確認修改";
        document.getElementById('cancelBtn').style.display = "inline-block";
        window.scrollTo(0,0);
    }

    function cancelEdit() {
        editingEmpName = null; 
        document.getElementById('employeeForm').querySelectorAll('input').forEach(i => { i.value = (i.type==='number'?0:''); i.disabled=false; }); 
        document.getElementById('saveBtn').innerText = "💾 儲存設定"; 
        document.getElementById('cancelBtn').style.display = "none";
    }

    async function saveEmp() { 
        showLoading("儲存資料中...");
        const d = { action: editingEmpName ? "editEmployee" : "saveEmployee", name: document.getElementById('eName').value, dept: document.getElementById('eDept').value, onboardingDate: document.getElementById('eDate').value, salary: document.getElementById('eSal').value, laborIns: document.getElementById('eLabor').value, healthIns: document.getElementById('eHealth').value, dependents: document.getElementById('eDependents').value, bonus: document.getElementById('eBonus').value };
        
        try {
            const res = await fetch(CONFIG_URL, {method:'POST', body:JSON.stringify(d)}); 
            const text = await res.text();
            if(text === "Success") {
                alert("✅ 員工資料儲存成功！");
            } else {
                alert("❌ 儲存失敗：" + text);
            }
        } catch(e) {
            alert("❌ 連線異常！請確認後台大腦是否已成功『發布為新版本』。");
        }
        
        cancelEdit(); 
        await fetchData(); 
    }

    async function deleteEmp(name) {
        if(!confirm(`⚠️ 嚴重警告：您確定要刪除員工「${name}」的所有資料嗎？\n\n(刪除後該員工將從名冊中永久移除，請謹慎操作！)`)) return;
        
        showLoading(`正在刪除 ${name} 的資料...`);
        try {
            const res = await fetch(CONFIG_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: "deleteEmployee", name: name }) 
            });
            const text = await res.text();
            if(text === "Success") {
                alert(`✅ 已成功刪除員工「${name}」！`);
                await fetchData(); 
            } else {
                alert("❌ 刪除失敗：" + text);
            }
        } catch (e) {
            alert("❌ 連線異常，請稍後再試。");
        } finally {
            hideLoading();
        }
    }

    async function calcSalary() { 
        const m = document.getElementById('rMonth').value; 
        if(!m) return alert("請先選取月份！"); 
        showLoading("正在進行薪資大結算，請稍候...");
        const timeout = setTimeout(() => { hideLoading(); alert("⚠️ 運算時間較長，請稍後再按「同步雲端資料」確認是否完成。"); }, 20000); 
        try {
            await fetch(CONFIG_URL, {method:'POST', body:JSON.stringify({action:"calculateSalary", targetMonth:m})}); 
            clearTimeout(timeout); await fetchData(); alert("✅ 結算完成！"); 
        } catch (e) { clearTimeout(timeout); hideLoading(); alert("❌ 結算發生錯誤，請重試。"); }
    }
    
    function exportExcel() {
        if (!db.Salary_Summary || db.Salary_Summary.length <= 1) return alert("請先點擊「結算薪資」產生資料喔！");
        showLoading("正在打包 Excel 檔案...");
        setTimeout(() => {
            try {
                const month = document.getElementById('rMonth').value || "報表";
                const ws = XLSX.utils.aoa_to_sheet(db.Salary_Summary);
                const wb = XLSX.utils.book_new(); 
                XLSX.utils.book_append_sheet(wb, ws, "薪資結算");
                XLSX.writeFile(wb, `禾禾園薪資結算_${month}.xlsx`);
            } catch (e) { alert("匯出失敗，請確認資料是否完整。"); } 
            finally { hideLoading(); }
        }, 800); 
    }

    async function makePDF() { 
        const m = document.getElementById('rMonth').value; 
        if(!m) return alert("請先選取月份！"); 
        showLoading("正在全自動生成 PDF 薪資單...");
        const timeout = setTimeout(() => { hideLoading(); alert("⚠️ PDF 生成數量較多，大腦還在背景努力中，請稍後至雲端硬碟查看！"); }, 25000); 
        try {
            await fetch(CONFIG_URL, {method:'POST', body:JSON.stringify({action:"generatePDF", targetMonth:m})}); 
            clearTimeout(timeout); hideLoading(); alert("✅ PDF 薪資單已全數存至雲端硬碟！"); 
        } catch(e) { clearTimeout(timeout); hideLoading(); alert("❌ 生成失敗，請重試。"); }
    }
    
    fetchData();
</script>
