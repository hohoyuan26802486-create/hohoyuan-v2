<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>禾禾園 - 專業管理後台 V18.6 (部門篩選與詳細人資版)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --success: #28a745; --warning: #f4b400; --danger: #d93025; --text-main: #3c4043; --text-sub: #70757a; --bg-gray: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f1f3f4; color: var(--text-main); padding: 20px; margin: 0; }
        .container { max-width: 1350px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.3); margin-bottom: 25px; }
        h1 { color: var(--text-main); font-size: 20px; font-weight: 500; margin-bottom: 15px; border-left: 5px solid var(--primary); padding-left: 15px; display: flex; justify-content: space-between; align-items: center;}
        
        /* 導覽與頁籤 */
        .top-nav { background: #202124; color: white; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 25px; border-radius: 12px; margin-bottom: 20px; gap: 15px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; flex-wrap: wrap;}
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 15px; font-weight: bold; color: var(--text-sub); cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #e8f0fe; color: var(--primary); }
        .dept-select-container { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #f8f9fa; padding: 10px 15px; border-radius: 8px; border: 1px solid #eee;}
        .dept-select { padding: 8px 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 15px; font-weight: bold; color: var(--primary); outline: none; background-color: white; cursor: pointer; min-width: 180px;}

        /* 表單與表格 */
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 900px; } 
        th { text-align: left; padding: 12px 10px; border-bottom: 2px solid #eee; color: var(--text-sub); font-size: 13px; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f1f1; vertical-align: middle; } 
        .main-info { font-size: 15px; font-weight: 600; color: #202124; }
        .sub-info { font-size: 12px; color: var(--text-sub); margin-top: 4px;}
        
        /* 按鈕樣式 */
        .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: #ffebee; color: #d93025; border: 1px solid #ffcdd2; }
        .btn-edit { background: white; border: 1px solid #dadce0; color: var(--text-main); }
        .proof-btn { display: inline-flex; align-items: center; background: #e8f0fe; color: #1a73e8 !important; border: 1px solid #cce0ff; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: bold; }

        /* HR 專用表單樣式 */
        .hr-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #eee; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><div id="loadingText" style="font-weight:bold; color:#1a73e8;">處理中，請稍候...</div></div>

<div class="container top-nav">
    <div style="font-size:18px; font-weight:bold;">禾禾園 · 專業後台系統</div>
    <div class="nav-actions">
        <select id="adminRole" onchange="authRole()" style="background:#3c4043; color:white; border:none; padding:10px; border-radius:6px; outline:none; font-size:14px;">
            <option value="業務部主管">業務部主管</option><option value="生產部主管">生產部主管</option><option value="運輸部主管">運輸部主管</option><option value="倉儲部主管">倉儲部主管</option><option value="會計部">會計部</option><option value="人事部">人事部</option><option value="副總">副總</option>
        </select>
        <button class="btn btn-primary" onclick="fetchData()">🔄 同步雲端資料</button>
    </div>
</div>

<div id="hrBox" class="container" style="display:none;">
    <h1>👥 員工人事維護</h1>

    <div style="background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;">
            <label style="font-weight:bold; color:#1a73e8; display:block; margin-bottom:5px;">1. 選擇部門</label>
            <select id="filterDept" onchange="updateEmpDropdown()" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; outline:none;">
                <option value="">顯示全公司 / 請選擇部門...</option>
                <option value="業務部">業務部</option>
                <option value="倉儲部">倉儲部</option>
                <option value="運輸部">運輸部</option>
                <option value="生產部">生產部</option>
                <option value="行政部">行政部</option>
                <option value="會計部">會計部</option>
            </select>
        </div>
        <div style="flex: 1; min-width: 200px;">
            <label style="font-weight:bold; color:#1a73e8; display:block; margin-bottom:5px;">2. 選擇員工 (進行細部調整)</label>
            <select id="filterEmp" onchange="loadEmpDetails()" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; outline:none;">
                <option value="">請先選擇部門...</option>
            </select>
        </div>
        <div style="flex: 0.5; min-width: 120px; display: flex; align-items: flex-end;">
            <button class="btn btn-warning" onclick="clearForm()" style="width: 100%; height: 35px;">➕ 新增員工</button>
        </div>
    </div>

    <div class="hr-form-grid">
        <div class="form-group"><label>姓名</label><input type="text" id="empName"></div>
        <div class="form-group"><label>部門</label>
            <select id="empDept">
                <option>業務部</option><option>倉儲部</option><option>運輸部</option><option>生產部</option><option>行政部</option><option>會計部</option>
            </select>
        </div>
        <div class="form-group"><label>計薪類別</label><select id="payType"><option>月薪</option><option>時薪</option></select></div>
        <div class="form-group"><label>基本底薪</label><input type="number" id="empSalary"></div>
        <div class="form-group"><label>到職日期</label><input type="date" id="obDate"></div>
        <div class="form-group"><label>變動獎金</label><input type="number" id="bonus" value="0"></div>
        <div class="form-group"><label>勞保自付</label><input type="number" id="laborIns" value="0"></div>
        <div class="form-group"><label>健保自付</label><input type="number" id="healthIns" value="0"></div>
        <div class="form-group"><label>眷屬人數</label><input type="number" id="dependents" value="0"></div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
            <button class="btn btn-success" onclick="saveEmployee()" style="width: 100%; height: 42px;">💾 儲存修改</button>
        </div>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead><tr><th>姓名</th><th>部門</th><th>計薪</th><th>薪資</th><th>到職日</th><th>剩餘特休</th><th>操作</th></tr></thead>
            <tbody id="staffBody"></tbody>
        </table>
    </div>
</div>

<div class="container">
    <h1>📝 假單審核中心</h1>
    <div class="tab-container">
        <button id="tab-pending" class="tab-btn active" onclick="switchTab('pending')">🔴 待處理假單</button>
        <button id="tab-history" class="tab-btn" onclick="switchTab('history')">⚪ 歷史紀錄</button>
    </div>
    <div class="table-responsive">
        <table>
            <thead><tr><th>申請資訊</th><th>起訖時間</th><th>假別</th><th>證明文件</th><th>狀態</th><th>核准操作</th></tr></thead>
            <tbody id="leaveBody"></tbody>
        </table>
    </div>
</div>

<script>
    const CONFIG_URL = "https://script.google.com/macros/s/AKfycbx0clQCOIOULOi58C0ffABTWNEwDa3KFVUF0TK9FCcj-O1aFLtxWkIF0IOv7bn_Wml4RA/exec";
    let db = {}; let currentTab = 'pending'; 

    function formatShortTime(timeStr) {
        if (!timeStr) return ""; const d = new Date(timeStr); if (isNaN(d)) return timeStr;
        const pad = (n) => n.toString().padStart(2, '0');
        return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showLoading(t){ document.getElementById('loadingText').innerText=t; document.getElementById('loadingOverlay').style.display='flex'; }
    function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active'); render(); 
    }

    function authRole() {
        const r = document.getElementById('adminRole').value;
        if((r==='人事部' || r==='會計部' || r==='副總') && prompt("請輸入管理員密碼")!=="123") { document.getElementById('adminRole').value="業務部主管"; }
        render();
    }

    async function fetchData() { 
        showLoading("正在獲取最新資料...");
        try { const res = await fetch(CONFIG_URL); db = await res.json(); render(); 
        } catch(e) { alert("網路連線異常，請確認網址或重整頁面。"); } finally { hideLoading(); }
    }

    function render() {
        const role = document.getElementById('adminRole').value;
        const hrBox = document.getElementById('hrBox');

        // 控制 HR 介面顯示與隱藏
        if (role === '人事部' || role === '會計部' || role === '副總') {
            hrBox.style.display = 'block';
            renderStaff(document.getElementById('filterDept').value); // 帶入目前的篩選狀態
        } else {
            hrBox.style.display = 'none';
        }

        // 渲染假單
        if(db.leave) {
            let leaveData = db.leave.filter(r => r[0] !== "單號 (ID)" && r[0] !== "ID" && r[0] !== "");
            leaveData.sort((a, b) => new Date(b[5]).getTime() - new Date(a[5]).getTime());

            if (currentTab === 'pending') {
                leaveData = leaveData.filter(r => r[8] && r[8].includes('待'));
            } else { leaveData = leaveData.filter(r => r[8] && (r[8].includes('已') || !r[8].includes('待'))); }

            let tableHTML = leaveData.map(r => {
                let next = '';
                if (role.includes(r[3].replace('部','')) && r[8] === '待主管審核') {
                    next = '待副總審核';
                } else if (role === '副總' && (r[8] === '待副總審核' || r[8] === '待人事審核')) { 
                    next = '待人事核銷'; 
                } else if (role === '人事部' && r[8] === '待人事核銷') {
                    next = '已生效';
                }
                
                let agentText = r[10] && r[10] !== "無" ? `<div class="sub-info" style="color:#1a73e8; font-weight:bold;">🤝 代理人：${r[10]}</div>` : '';
                let reasonText = r[7] ? `<div class="sub-info">📝 事由：${r[7]}</div>` : '';
                
                let proofUrl = r[9] ? String(r[9]).trim() : "";
                let proof = "";
                if (proofUrl.includes('http')) {
                    proof = `<a href="${proofUrl}" target="_blank" class="proof-btn">📎 查看單據</a>`;
                } else if (proofUrl === "待補件") {
                    proof = `<span style="color:#d93025; font-weight:bold; background:#fce8e6; padding:4px 8px; border-radius:4px; font-size:12px;">⚠️ 待補件</span>`;
                } else { proof = `<span style="color:#aaa; font-size:13px;">無</span>`; }
                
                let statusColor = r[8] === '已生效' ? '#28a745' : (r[8].includes('退') ? '#d93025' : '#1a73e8');
                let actionBtn = (next && currentTab === 'pending') ? `<button class="btn btn-success" onclick="updLv('${r[0]}','${next}')">核准</button>` : `<span style="color:#ccc">-</span>`;

                return `<tr>
                    <td>
                        <div class="main-info">${r[2]} <span class="sub-info">(${r[3]})</span></div>
                        ${agentText}
                        ${reasonText}
                    </td>
                    <td><div style="font-size:13px; color:#3c4043;">${formatShortTime(r[5])} <br> <span style="color:#aaa;">~</span> ${formatShortTime(r[6])}</div></td>
                    <td><div style="font-weight:bold;">${r[4]}</div></td>
                    <td>${proof}</td>
                    <td><span style="font-weight:bold; color:${statusColor}">${r[8]}</span></td>
                    <td>${actionBtn}</td>
                </tr>`;
            }).join('');

            if (leaveData.length === 0) tableHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:#70757a;">目前沒有${currentTab === 'pending' ? '待處理' : '歷史'}假單</td></tr>`;
            document.getElementById('leaveBody').innerHTML = tableHTML;
        }
    }

    // 🌟 渲染員工清單 (支援依部門篩選)
    function renderStaff(filterDept = "") {
        if(!db.employees) return;
        const staffBody = document.getElementById('staffBody');
        if(!staffBody) return;

        let staffData = db.employees.filter(r => r[0] !== "姓名" && r[0] !== "");
        
        // 如果有選擇部門，過濾名單
        if (filterDept) {
            staffData = staffData.filter(r => r[1] === filterDept);
        }

        staffBody.innerHTML = staffData.map(r => `
            <tr>
                <td class="main-info">${r[0]}</td>
                <td>${r[1]}</td>
                <td>${r[2]}</td>
                <td>$${r[3]}</td>
                <td>${r[4] ? new Date(r[4]).toLocaleDateString() : '-'}</td>
                <td>${r[5] || 0} 天</td>
                <td>
                    <button class="btn btn-edit" style="padding:4px 8px; font-size:12px;" onclick="quickEdit('${r[0]}', '${r[1]}')">編輯</button>
                    <button class="btn btn-danger" style="padding:4px 8px; font-size:12px; margin-left:5px;" onclick="deleteEmp('${r[0]}')">刪除</button>
                </td>
            </tr>
        `).join('');
    }

    // 🌟 選擇部門時：更新員工下拉選單，並更新下方表格
    function updateEmpDropdown() {
        const dept = document.getElementById('filterDept').value;
        const empSelect = document.getElementById('filterEmp');
        empSelect.innerHTML = '<option value="">請選擇員工...</option>';
        
        renderStaff(dept); // 同步更新下方清單

        if (!dept || !db.employees) return;
        const staffData = db.employees.filter(r => r[0] !== "姓名" && r[0] !== "" && r[1] === dept);
        staffData.forEach(r => {
            empSelect.innerHTML += `<option value="${r[0]}">${r[0]}</option>`;
        });
    }

    // 🌟 選擇員工時：將他的詳細資料填入表單
    function loadEmpDetails() {
        const name = document.getElementById('filterEmp').value;
        if (!name || !db.employees) return clearForm();

        const emp = db.employees.find(r => r[0] === name);
        if (emp) {
            document.getElementById('empName').value = emp[0] || '';
            document.getElementById('empDept').value = emp[1] || '業務部';
            document.getElementById('payType').value = emp[2] || '月薪';
            document.getElementById('empSalary').value = emp[3] || '';
            
            // 處理日期格式
            let dateVal = "";
            if (emp[4]) {
                const d = new Date(emp[4]);
                if (!isNaN(d)) dateVal = d.toISOString().split('T')[0];
            }
            document.getElementById('obDate').value = dateVal;
            
            document.getElementById('bonus').value = emp[6] || 0;
            document.getElementById('laborIns').value = emp[7] || 0;
            document.getElementById('healthIns').value = emp[8] || 0;
            document.getElementById('dependents').value = emp[9] || 0;
        }
    }

    // 🌟 表格裡的快速編輯按鈕
    function quickEdit(name, dept) {
        document.getElementById('filterDept').value = dept;
        updateEmpDropdown();
        document.getElementById('filterEmp').value = name;
        loadEmpDetails();
        window.scrollTo({ top: document.getElementById('hrBox').offsetTop, behavior: 'smooth' });
    }

    // 🌟 清空表單
    function clearForm() {
        document.getElementById('filterEmp').value = "";
        document.getElementById('empName').value = "";
        document.getElementById('empDept').value = document.getElementById('filterDept').value || "業務部";
        document.getElementById('empSalary').value = "";
        document.getElementById('obDate').value = "";
        document.getElementById('bonus').value = "0";
        document.getElementById('laborIns').value = "0";
        document.getElementById('healthIns').value = "0";
        document.getElementById('dependents').value = "0";
    }

    // 🌟 儲存員工資料 (完整包含眷屬人數)
    async function saveEmployee() {
        const payload = {
            action: "saveEmployee",
            name: document.getElementById('empName').value,
            dept: document.getElementById('empDept').value,
            payType: document.getElementById('payType').value,
            salary: document.getElementById('empSalary').value,
            onboardingDate: document.getElementById('obDate').value,
            bonus: document.getElementById('bonus').value,
            laborIns: document.getElementById('laborIns').value,
            healthIns: document.getElementById('healthIns').value,
            dependents: document.getElementById('dependents').value
        };
        
        if(!payload.name || !payload.salary) return alert("姓名與基本底薪為必填項目！");
        showLoading("儲存員工資料中...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert("✅ 儲存成功！"); 
            await fetchData(); 
            clearForm();
        } catch(e) { 
            alert("儲存失敗，請確認網路狀態。"); hideLoading(); 
        }
    }

    async function updLv(id, s) {
        if(!confirm(`確認將此假單狀態更新為：${s} ？`)) return;
        showLoading("核准處理中，請稍候...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "updateLeave", id: id, newStatus: s })});
            await fetchData(); alert("✅ 審核完成！");
        } catch (e) { hideLoading(); alert("發生錯誤，請重試"); }
    }

    async function deleteEmp(name) {
        if(!confirm(`確定要刪除員工：${name}？此動作無法復原！`)) return;
        showLoading("正在刪除資料...");
        try {
            await fetch(CONFIG_URL, { method: 'POST', body: JSON.stringify({ action: "deleteEmployee", name: name })});
            await fetchData(); alert("✅ 已成功刪除。");
        } catch (e) { alert("刪除失敗"); hideLoading(); }
    }

    // 初始化讀取資料
    fetchData();
</script>
</body>
</html>
